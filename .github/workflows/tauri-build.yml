name: Tauri Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default; the build job re-grants contents: write for
# tag-triggered release uploads.
permissions:
  contents: read

jobs:
  build:
    # vars.ENABLE_TAURI_BUILD: fork toggle (#207), default on; unset upstream.
    if: vars.ENABLE_TAURI_BUILD != 'false'
    # MUST stay on GitHub-hosted runner per .claude/rules/ci-cd-security.md
    # Layer 2 (no self-hosted for PR-touched code paths).
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for tag-triggered release uploads
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        # SHA-pinned third-party action (#333): this job holds contents: write.
        # Pinned to the tip of the `stable` branch — that branch is the action
        # itself (a self-contained composite defaulting toolchain: stable), not a
        # moving alias for a release, so Dependabot cannot bump it by semver.
        # Refresh manually when the Rust setup needs it.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-16

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: client/src-tauri

      - name: Install Tauri OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        working-directory: client
        run: npm run tauri:build -- --bundles deb,appimage
        env:
          VITE_TAURI: '1'

      - name: Upload artifacts (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: baluhost-companion-dev
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

      - name: Upload to release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage
